project:
  type: website
  output-dir: _site
  resources:
    - config/webr-workstation.js
    - brand/favicon.svg
    - brand/logo.svg
    - brand/mark.svg

website:
  title: "webR Station"
  favicon: brand/favicon.svg
  description: "Estação de trabalho com R no navegador via WebAssembly."
  navbar:
    background: light
    foreground: dark
    logo: brand/logo.svg
    logo-alt: "webR Station"
    logo-href: index.html
    title: "webR Station"
    left:
      - href: index.qmd
        text: Console
      - href: https://docs.r-wasm.org/webr/latest/
        text: Docs webR
      - href: https://github.com/r-wasm/webr
        text: r-wasm
      - href: https://github.com/batistalucasv/webr
        text: GitHub
  page-footer:
    center: |
      <span class="webr-footer">
        <span><strong>webR Station</strong> — Execução de R no navegador via WebAssembly.</span><br>
        <small style="opacity: 0.85;">Powered by <a href="https://docs.r-wasm.org/webr/latest/" target="_blank" rel="noopener">webR</a> (George Stagg & Posit PBC) e <a href="https://github.com/coatless/quarto-webr" target="_blank" rel="noopener">quarto-webr</a> (James J. Balamuta)</small>
      </span>

lang: pt-BR

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    page-layout: full
    code-copy: true
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

webr:
  show-startup-message: true
  channel-type: post-message
  cell-options:
    autorun: false

filters:
  - webr
