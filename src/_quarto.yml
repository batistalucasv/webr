project:
  type: website
  output-dir: _site
  resources:
    - config/webr-workstation.js
    - brand/favicon.svg
    - brand/mark.svg
    - brand/lockup.svg

website:
  title: "webR — Estação de Análise"
  favicon: brand/favicon.svg
  description: "Estação de trabalho com R no navegador via WebAssembly."
  navbar:
    background: light
    foreground: dark
    logo: brand/mark.svg
    logo-alt: "Área Basal"
    logo-href: https://areabasal.com.br/
    title: "webR"
    left:
      - href: https://areabasal.com.br/
        text: Área Basal
      - href: https://areabasal.com.br/estudo/
        text: Estudo
      - href: index.qmd
        text: webR
      - href: https://areabasal.com.br/sobre.html
        text: Sobre
  page-footer:
    center: |
      <span class="ab-footer">
        <img class="ab-footer-mark" src="/brand/mark.svg" width="18" height="18" alt="" aria-hidden="true">
        <span>© 2026 Área Basal. Todos os direitos reservados.</span>
      </span>

lang: pt-BR

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    page-layout: full
    code-copy: true
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

webr:
  show-startup-message: true
  channel-type: post-message
  cell-options:
    autorun: false

filters:
  - webr
